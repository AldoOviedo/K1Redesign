<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,600;0,700;1,700&display=swap" rel="stylesheet">
    <title>K1 Speed</title>
</head>
<body>

<header class="header">

<div class="header-top-row">

  <button class="menu-btn" aria-label="Open menu" aria-expanded="false">
    <span class="bar" aria-hidden="true"></span>
    <span class="bar" aria-hidden="true"></span>
  </button>
  <img src="assets/k1speed-logo.png" alt="LOGO" class="header-logo">

  <button class="header-button">Race now</button>
</div>
</header>

<section class="header-location-div">
  <div>Burbank</div>
  <div>Open today: 12 - 10pm</div>
</section>

<section class="hero-image-container">
  <img src="assets/k1-kart-transparent.png" alt="Kart Hero Image" class="hero-image">
  <div class="hero-box-shadow" aria-hidden="true"></div>
</section>

<section class="hero-text">
  <div class="hero-big-text">Race today.</div>
  <div class="hero-big-text2"> No reservation needed.</div>
  <div class="hero-small-text">At most locations. Adults and juniors 48″ and up.</div>
</section>

<section class="button-row">
  <button class="action-button-main">Find my track</button>
  <button class="action-button-main">Buy races</button>
</section>

<section class="divider-container">
  <div class="main-divider"></div>
</section>

<section class="location-container">

  <div class="location-container-header">
    <div class="location-container-header-text">Burbank</div>
    <button class="location-container-header-button">Change</button>
  </div>

  <div class="location-container-body">

   <div class="location-container-section">
     <div>Hours today</div>
     <div>12 - 10pm</div>
   </div>

    <div class="secondary-divider"></div>

    <div class="location-container-section">
      <div>Arrive and drive</div>
      <div>From $31</div>
    </div>

    <div class="secondary-divider"></div>

    <div class="location-container-section">
      <div>Address</div>
      <div>960 CHESTNUT ST.</div>
    </div>

    <div class="secondary-divider"></div>

  </div>

</section>

<section class="button-row">
  <button class="action-button-main">Directions</button>
  <button class="action-button-main">Call</button>
</section>

<section class="wtr-section">
  <div class="wtr-section-text">Ways to race</div>
</section>



</body>
</html>
